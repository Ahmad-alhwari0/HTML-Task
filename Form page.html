<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form page</title>
</head>
<body>
    <h1>Application Form </h1>
    <form>
        <label for="fname">First Name:</label>
        <input type="text" id="fname">
        <label for="lname">Last Name:</label>
        <input type="text" id="lname">
        <br>
        <br>
        <label for="date">Data of birth</label>
        <input type="date" id="date">
        <label for="age">age</label>
        <input type="number" id="age">
        <br>
        <br>
        <label for="gender">Gender</label>
        <select id="gender" name="gender">
        <option>Male</option>
        <option>Female</option>
        </select>
        <label for="Email">Email Addres:</label>
        <input type="email" id="Email" placeholder="Enter email address">
        <br>
        <br>
        <label>position available:</label>

        <input type="radio" id="junior" name="position">
        <label for="junior">Junior Developer</label>

        <input type="radio" id="mid" name="position">
        <label for="mid">Mid-level Developer</label>

       <input type="radio" id="senior" name="position">
       <label for="senior">Senior Developer</label>
       <br>
       <br>
       <label>programming language:</label>
        
       <input type="checkbox" id="java">
       <label for="java">Java</label>

       <input type="checkbox" id="JavaScript">
       <label for="JavaScript">JavaScript</label>

       <input type="checkbox" id="python ">
       <label for="python ">python </label>


       <br>
       <br>
       <label for="password">Password:</label>
       <input type="password">

       <label for="password">Confirm Password:</label>
       <input type="password">
       <br>
       <br>


       <button>Submit</button>
       <button>Reset</button>








        

    </form>
    
</body>
</html>
